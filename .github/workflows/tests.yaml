name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          # Current Home Assistant requires Python >= 3.14.2.
          python-version: "3.14"
      # pytest-homeassistant-custom-component pulls in Home Assistant itself;
      # the integration has no requirements of its own.
      - name: Install test requirements
        run: python -m pip install --upgrade -r requirements_test.txt
      - name: Run tests
        run: pytest -q
  ruff:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
